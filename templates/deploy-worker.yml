# Cloudflare Worker 배포 (앱 저장소의 .github/workflows/deploy.yml로 복사한다)
# wrangler.toml에 적힌 이름과 설정으로 올린다.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # 허브의 "새 버전 배포" 버튼

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 설치
        run: npm ci || npm install

      - name: 테스트와 빌드 (스크립트가 있을 때만)
        run: |
          npm test --if-present
          npm run build --if-present

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
